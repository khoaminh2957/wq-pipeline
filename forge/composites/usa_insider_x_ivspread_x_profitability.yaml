id: usa_insider_x_ivspread_x_profitability
title: Insider buying confirmed by the option market, in profitable firms (USA Insiders cell)
arm: new
legs: [insider_significant_buying_drift, option_call_put_iv_spread, usa_profitability_ratios]
families: [insider, options, profitability]
combiners: [multiply]
mechanism: >
  Significant insider purchases drift because outsiders underreact to the one trader with private
  information about the firm; the drift is strongest where the option market, which pays for its
  view, already prices the upside (calls above puts in implied volatility). The third rank keeps the
  profitable firms among them: an insider buying a profitable firm is buying earnings that persist,
  an insider buying a loss-maker is buying an option. The product isolates profitable names with
  insider buying and option-market confirmation; holders of unprofitable names without either take
  the other side.
counterparty: "Retail holders and index funds that track neither insider filings nor the option market"
source: "EX-ANTE — Lakonishok & Lee 2001 (insider purchases); Cremers & Weinbaum 2010 (call-put IV spread); Novy-Marx 2013 (gross profitability). Conjunction stated by docs/harness5/round_2/subuniverse.md §6 (Portfolio, 2026-09-09)."
regimes: {value_winter_2014_2020: "+", momentum_crash_2016: "0", covid_2020: "+", rate_shock_2022: "+"}
strongest_in: "mid caps with listed options where insider purchases are rare enough to be informative"
weakens_when: "insider buying is programmatic (10b5-1 plans) or option prices are distorted by volatility events"
settings:
  neutralization: [STATISTICAL, SUBINDUSTRY, INDUSTRY]
  decay: [4, 8]
  truncation: 0.08
notes: >
  NEUTRALISATION GRID EXTENDED 2026-09-09 19:58 (INDUSTRY added). MEASURED on this composite's own
  469 rows: STATISTICAL reads PROD_CORRELATION 0.537-0.553 (clear of the 0.71 line) but fitness max
  0.89 in 229 rows; SUBINDUSTRY reads PROD 0.649-0.732 and produced the one all-binding pass
  (Vk67oQ5V, fitness 1.03, PROD 0.732 - held). The neutralisation that buys fitness is the one that
  raises PROD. INDUSTRY was never in this grid; diagnosis_fitness.md §3 measures INDUSTRY and
  SUBINDUSTRY at the same book volatility (sigma 0.027-0.051 vs STATISTICAL 0.018-0.022), so its
  fitness should reach SUBINDUSTRY's. Its PROD on this mechanism is UNKNOWN and is the measurement.
  PURPOSE (subuniverse.md §6.1): rows at the Sharpe bar on the Insiders cell that also pass
  LOW_SUB_UNIVERSE_SHARPE. Same EX-ANTE expectation and refutation line as
  usa_sentiment_x_ivspread_x_profitability. Regime signs are EX-ANTE reasoning: '+' in 2022 from the
  profitability leg; insider buying in the 2020 crash was heavy and profitable (Lakonishok-Lee pattern).
