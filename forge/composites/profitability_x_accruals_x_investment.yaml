id: profitability_x_accruals_x_investment
title: Profitable, cash-backed and not over-investing (q-factor plus accruals)
legs: [profitability_classic_ratios, accruals_cashflow_classic, asset_growth_classic]
families: [profitability, accruals, investment]
combiners: [multiply]
mechanism: >
  Expected returns rise with profitability and fall with investment and with accruals; a firm
  that earns much, books it as cash and does not expand its asset base is the corner of the
  cross-section that both the q-factor model and the accrual anomaly reward, and the product of
  the three ranks isolates it. Growth investors who pay for expansion and earnings-chasers who
  ignore the cash backing take the other side.
counterparty: "Growth investors and index-tracking funds that pay for expansion, and earnings-chasing retail buyers who ignore accruals"
source: "EX-ANTE — Hou, Xue & Zhang 2015 (q-factor: investment and profitability); Sloan 1996; Cooper, Gulen & Schill 2008"
regimes: {value_winter_2014_2020: "0", momentum_crash_2016: "+", covid_2020: "-", rate_shock_2022: "+"}
strongest_in: "mid-cap names with volatile capital budgets"
weakens_when: "credit is abundant and expansion is rewarded regardless of returns (2020-2021)"
settings:
  neutralization: [SUBINDUSTRY, INDUSTRY, STATISTICAL]
  decay: [8, 16]
  truncation: 0.08
