id: intangibles_x_profitability_x_safety_x_revisions
title: Productive intangibles, profitable, safe, and being revised up (four legs)
legs: [rd_intensity_premium, profitability_classic_ratios, smartratios_credit_safety, analyst_estimate_revision_drift]
families: [intangibles, profitability, distress, revisions]
combiners: [multiply]
mechanism: >
  The three-leg product of R&D intensity, profitability and credit safety reached a median Sharpe
  of 1.11 on GLB Fundamental; a fourth leg asks whether analysts are currently revising the
  firm up, so the product keeps only productive, profitable, safe firms whose improving outlook
  has not yet been priced. Book-value investors avoid the first, slow-rebalancing institutions
  supply the last; the underpricing persists because no single screen catches all four.
counterparty: "Book-value investors and index funds that screen on unadjusted book ratios, and institutions that rebalance on quarterly consensus prints"
source: "EX-ANTE — Chan, Lakonishok & Sougiannis 2001; Novy-Marx 2013; Campbell, Hilscher & Szilagyi 2008; Gleason & Lee 2003"
regimes: {value_winter_2014_2020: "+", momentum_crash_2016: "0", covid_2020: "+", rate_shock_2022: "-"}
strongest_in: "technology and healthcare names with steady R&D, a credit score and analyst coverage"
weakens_when: "rates rise sharply and long-duration cash flows are discounted (2022)"
settings:
  neutralization: [SUBINDUSTRY, INDUSTRY, STATISTICAL]
  decay: [8, 16]
  truncation: 0.08
