id: intangibles_x_profitability_x_safety_x_accruals
title: Productive intangibles, profitable, safe and cash-backed (four legs)
legs: [rd_intensity_premium, profitability_classic_ratios, smartratios_credit_safety, accruals_cashflow_classic]
families: [intangibles, profitability, distress, accruals]
combiners: [multiply]
mechanism: >
  The three-leg product of R&D intensity, profitability and credit safety reached a median Sharpe
  of 1.11 on GLB Fundamental; a fourth leg asks whether the profits are cash-backed, removing the
  firms whose reported profitability rests on accruals that later reverse. Book-value investors
  avoid the first, earnings-chasers ignore the last; the product keeps the persistent corner.
counterparty: "Book-value investors and index funds that screen on unadjusted book ratios, and earnings-chasing retail buyers who ignore accruals"
source: "EX-ANTE — Chan, Lakonishok & Sougiannis 2001; Novy-Marx 2013; Campbell, Hilscher & Szilagyi 2008; Sloan 1996"
regimes: {value_winter_2014_2020: "+", momentum_crash_2016: "0", covid_2020: "+", rate_shock_2022: "-"}
strongest_in: "technology and healthcare names with steady R&D, a credit score and full cash-flow statements"
weakens_when: "rates rise sharply and long-duration cash flows are discounted (2022)"
settings:
  neutralization: [SUBINDUSTRY, INDUSTRY, STATISTICAL]
  decay: [8, 16]
  truncation: 0.08
