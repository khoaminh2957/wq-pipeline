id: intangible_intensity_premium
family: intangibles
category: Model
title: Intangible-intensive firms earn a premium the book misses
mechanism: >
  R&D and organisational capital are expensed, so intangible-intensive firms look expensive on
  book measures and are underpriced. Long the names with the highest knowledge- and
  organisational-capital intensity scores.
counterparty: Investors who value firms on unadjusted book figures.
sign: 1
source: "EX-ANTE — Chan, Lakonishok & Sougiannis 2001 (R&D intensity and returns); Eisfeldt & Papanikolaou 2013 (organization capital); Peters & Taylor 2017"
datasets: [model313]
signal:
  fields: [mdl313_iai, mdl313_ick, mdl313_ico]
template:
  - "group_rank(ts_backfill({signal}, {w}), {group})"
  - "group_rank(ts_rank(ts_backfill({signal}, 63), {w}), {group})"
params:
  w: [21, 63]
  group: [subindustry, industry, sector]
settings:
  neutralization: [SUBINDUSTRY, INDUSTRY, STATISTICAL]
  decay: [8, 16]
  truncation: 0.08
regions: any
delays: [0, 1]
