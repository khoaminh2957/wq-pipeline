id: insider_buy_sell_ratio
family: insider
category: [Other, Insiders]
title: Insiders' buy-to-sell ratio predicts returns
mechanism: >
  Insiders buy on private information and sell for many other reasons, so the ratio of their
  purchases to sales over one to three months is informative. Long the names where insiders,
  and especially the top insiders, have been net buyers (the vendor fills missing days).
counterparty: Sellers to insiders who do not see what the insiders see.
sign: 1
source: "EX-ANTE — Lakonishok & Lee 2001 (insider purchases predict returns; aggregate buy/sell ratio); Jeng, Metrick & Zeckhauser 2003"
datasets: [insider_feats]
signal:
  fields: [buy_sell_ratio_all_60d_filled, buy_sell_ratio_top5_60d_filled, buy_sell_tx_count_ratio_all_60d_filled, buy_sell_ratio_top20_20d_filled_2]
template:
  - "group_rank(ts_backfill({signal}, {w}), {group})"
  - "group_rank(ts_rank(ts_backfill({signal}, 63), {w}), {group})"
params:
  w: [5, 21]
  group: [subindustry, industry, sector]
settings:
  neutralization: [SUBINDUSTRY, INDUSTRY, STATISTICAL]
  decay: [8, 16]
  truncation: 0.08
regions: any
delays: [0, 1]
