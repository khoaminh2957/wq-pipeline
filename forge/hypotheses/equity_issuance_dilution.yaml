id: equity_issuance_dilution
family: financing
category: Fundamental
title: Firms that issue equity underperform
mechanism: >
  Managers issue shares when they believe the stock is overvalued; net issuance predicts low
  returns for years. Short the names with the highest equity dilution indicator.
counterparty: Investors who buy what managers sell.
sign: -1
source: "EX-ANTE — Pontiff & Woodgate 2008 (share issuance and cross-sectional returns); Daniel & Titman 2006; Loughran & Ritter 1995"
datasets: [fundamental90, other401]
signal:
  fields: [fnd90_game_equity_dilution, fnd90_game_esop_grant]
template:
  - "-group_rank(ts_backfill({signal}, {w}), {group})"
  - "-group_rank(ts_rank(ts_backfill({signal}, 63), {w}), {group})"
params:
  w: [63, 126]
  group: [subindustry, industry, sector]
settings:
  neutralization: [SUBINDUSTRY, INDUSTRY, STATISTICAL]
  decay: [8, 16]
  truncation: 0.08
regions: any
delays: [0, 1]
