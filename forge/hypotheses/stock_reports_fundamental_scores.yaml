id: stock_reports_fundamental_scores
family: profitability
category: Fundamental
title: Earnings, fundamental and valuation report scores predict returns
mechanism: >
  Research-report scores that aggregate earnings revisions, fundamental strength and relative
  valuation summarise information that diffuses slowly. Long the names with the highest
  earnings, fundamental and relative-valuation scores (the price-momentum score is excluded:
  it is a price carrier).
counterparty: Investors slower than the report.
sign: 1
source: "SOURCE — Refinitiv Stock Reports Plus / StarMine model documentation (earnings score = analyst revision model). EX-ANTE — Chan, Jegadeesh & Lakonishok 1996 (revisions); Piotroski 2000 (fundamental strength)"
datasets: [model56, fundamental86]
signal:
  fields: [srp_earnings_score, srp_fundamental_score, srp_relative_valuation_score]
template:
  - "group_rank(ts_backfill({signal}, {w}), {group})"
  - "group_rank(ts_rank(ts_backfill({signal}, 63), {w}), {group})"
params:
  w: [5, 21]
  group: [subindustry, industry, sector]
settings:
  neutralization: [SUBINDUSTRY, INDUSTRY, STATISTICAL]
  decay: [8, 16]
  truncation: 0.08
regions: any
delays: [0, 1]
