id: news_event_intensity_reversal
family: attention
category: News
title: Bursts of tagged corporate developments reverse
mechanism: >
  The number of significant developments tagged for a company in a day measures how much is
  happening to it and how much attention it draws. Bursts of developments coincide with crowded,
  attention-driven trading; the price impact of that trading decays over the following days.
counterparty: Traders reacting to headline volume rather than content.
sign: -1
source: "EX-ANTE — Barber & Odean 2008; Chan 2003 (reversal after no-information price moves, drift after news) — the count carries attention, not content, so the attention side is the bet"
datasets: [news29]
signal:
  fields: [nws29_significance]   # nws29_full_significance dropped 2026-09-04: same description, and the canary's guard refused the twin pairs (POST-HOC, mechanism unknown)
  vector: vec_count
  density: zero
template: "-group_rank(ts_sum({signal}, {w}), {group})"
params:
  w: [3, 5, 10]
  group: [subindustry, industry]
settings:
  neutralization: [SUBINDUSTRY, INDUSTRY]
  decay: [4, 8, 16]
  truncation: 0.08
regions: any
delays: [0, 1]
